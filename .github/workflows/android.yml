name: Build Hotlah Android

on:
  workflow_dispatch:
    inputs:
      release:
        description: Build a signed APK and Google Play App Bundle (requires Android signing secrets)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build and lint test APK
        run: gradle --no-daemon -p android :app:assembleDebug :app:lintDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: hotlah-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare upload keystore
        if: ${{ inputs.release }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo 'Missing Android upload signing secrets; see android/README.md.' >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hotlah-upload.jks"
          chmod 600 "$RUNNER_TEMP/hotlah-upload.jks"

      - name: Build signed Play bundle and APK
        if: ${{ inputs.release }}
        env:
          HOTLAH_UPLOAD_KEYSTORE: ${{ runner.temp }}/hotlah-upload.jks
          HOTLAH_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          HOTLAH_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          HOTLAH_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon -p android :app:bundleRelease :app:assembleRelease

      - name: Upload signed release artifacts
        if: ${{ inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: hotlah-android-signed-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
